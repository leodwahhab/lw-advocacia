<script>
(function () {
  var screens = Array.prototype.slice.call(document.querySelectorAll('.pv-screen'));
  var tpl = document.getElementById('landing');

  // Monta uma cópia da landing por tela, com ids únicos
  screens.forEach(function (screen, n) {
    var frag = tpl.content.cloneNode(true);
    var sfx = '-' + screen.dataset.w;
    frag.querySelectorAll('[id]').forEach(function (el) { el.id += sfx; });
    frag.querySelectorAll('[for]').forEach(function (el) { el.htmlFor += sfx; });
    frag.querySelectorAll('[aria-describedby]').forEach(function (el) {
      el.setAttribute('aria-describedby', el.getAttribute('aria-describedby').split(' ').map(function (t) { return t + sfx; }).join(' '));
    });
    frag.querySelectorAll('a[href^="#"], use').forEach(function (el) {
      var h = el.getAttribute('href');
      if (h && h.length > 1) el.setAttribute('href', h + sfx);
    });
    screen.appendChild(frag);
    var fold = screen.querySelector('.pv-fold');
    fold.style.height = screen.dataset.fold + 'px';
  });

  // Logo: publicado em assets/; aberto localmente, fica em ../assets/
  document.querySelectorAll('img.pv-logo').forEach(function (img) {
    img.addEventListener('error', function () {
      if (!img.dataset.retry) { img.dataset.retry = '1'; img.src = '../assets/lw-advocacia-logo-wordmark.jpg'; }
    });
  });

  // Media queries viram container queries e vw vira cqi, para cada tela responder à própria largura
  function rewrite(css) {
    return css.replace(/@media\s*\(min-width:/g, '@container pv (min-width:').replace(/(\d)vw\b/g, '$1cqi');
  }
  Promise.all(['tokens.css', 'components.css'].map(function (u) {
    return fetch(u).then(function (r) { if (!r.ok) throw new Error(u); return r.text(); });
  })).then(function (texts) {
    var style = document.createElement('style');
    style.textContent = rewrite(texts.join('\n'));
    document.head.appendChild(style);
    document.getElementById('css-components').disabled = true;
    layout();
  }).catch(function () {
    // Sem fetch (arquivo aberto do disco): mostra só uma tela, responsiva pela janela
    document.querySelector('.pv-device[data-w="1440"]').hidden = true;
    var s = document.querySelector('.pv-screen[data-w="390"]');
    s.style.width = '100%';
    s.parentNode.parentNode.querySelector('.pv-label').textContent = 'Responsiva pela largura da janela';
  });

  function layout() {
    var stage = document.getElementById('stage');
    var avail = stage.clientWidth;
    var mobile = screens[0], desk = screens[1];
    var mScale = Math.min(1, avail / 390);
    var sideBySide = avail >= 390 + 32 + 560;
    var dAvail = sideBySide ? avail - 390 - 32 : avail;
    var dScale = Math.min(1, dAvail / 1440);
    mobile.style.width = '390px'; mobile.style.zoom = mScale;
    desk.style.width = '1440px'; desk.style.zoom = dScale;
    document.getElementById('pv-scale').textContent = dScale < 1 ? '· escala ' + Math.round(dScale * 100) + '%' : '';
    screens.forEach(function (s) {
      var cookie = s.querySelector('.cookie');
      var fab = s.querySelector('.fab');
      var narrow = s.dataset.w === '390';
      fab.style.setProperty('--fab-offset', (!cookie.hidden && narrow) ? (cookie.offsetHeight + 12) + 'px' : '0px');
    });
  }
  window.addEventListener('resize', function () { if (document.getElementById('css-components').disabled) layout(); });

  // Cookies: escolher fecha o banner e devolve o FAB ao lugar
  document.querySelectorAll('[data-cookie]').forEach(function (b) {
    b.addEventListener('click', function () {
      var c = b.closest('.cookie'); c.hidden = true;
      c.parentNode.querySelector('.fab').style.setProperty('--fab-offset', '0px');
    });
  });

  // Microinteração 1: revelação do título, uma vez
  document.querySelectorAll('.reveal').forEach(function (el) {
    var i = 0;
    (function wrap(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (child) {
        if (child.nodeType === 3) {
          var f = document.createDocumentFragment();
          child.textContent.split(/(\s+)/).forEach(function (part) {
            if (!part) return;
            if (/^\s+$/.test(part)) { f.appendChild(document.createTextNode(part)); return; }
            var s = document.createElement('span');
            s.className = 'w'; s.style.setProperty('--i', i++); s.textContent = part;
            f.appendChild(s);
          });
          node.replaceChild(f, child);
        } else if (child.nodeType === 1) { wrap(child); }
      });
    })(el);
    el.setAttribute('aria-label', el.textContent.replace(/\s+/g, ' ').trim());
    requestAnimationFrame(function () { el.classList.add('is-ready'); });
  });

  // Microinteração 5: pulso único do FAB após 6 s
  setTimeout(function () {
    document.querySelectorAll('.fab').forEach(function (f) { f.classList.add('is-pulsing'); });
  }, 6000);

  // Sem envio real na prévia
  document.querySelectorAll('form').forEach(function (f) { f.addEventListener('submit', function (e) { e.preventDefault(); }); });
})();
</script>
