<!-- @dsCard group="Conteúdo" height=420 subtitle="Card de área de atuação: default, hover e foco" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PracticeCard — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<style>.demo { padding: 24px; } .card-grid { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }</style>
</head>
<body>
<div class="demo">
  <div class="card-grid">
    <article class="practice-card">
      <svg class="icon icon--32 practice-card__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/></svg>
      <h3 class="t-h3 practice-card__title">Família</h3>
      <p class="practice-card__text">Descrição curta da área, em uma ou duas linhas.</p>
      <a class="link-arrow" href="#">Saiba mais<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
    </article>
    <article class="practice-card is-hover">
      <svg class="icon icon--32 practice-card__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>
      <h3 class="t-h3 practice-card__title">Trabalhista</h3>
      <p class="practice-card__text">Estado hover: sobe 2px e a borda escurece.</p>
      <a class="link-arrow is-hover" href="#">Saiba mais<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
    </article>
    <article class="practice-card is-hover" style="outline: 2px solid var(--color-focus); outline-offset: 3px;">
      <svg class="icon icon--32 practice-card__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
      <h3 class="t-h3 practice-card__title">Cível</h3>
      <p class="practice-card__text">Estado focus-visible: o anel envolve o card inteiro.</p>
      <a class="link-arrow" href="#">Saiba mais<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
    </article>
  </div>
</div>
</body>
</html>
