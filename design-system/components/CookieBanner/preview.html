<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CookieBanner — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<style>.demo { padding: 24px; }</style>
</head>
<body>
<div class="demo">
  <section class="cookie cookie--static" role="region" aria-label="Aviso de cookies">
    <p>Usamos cookies essenciais e, com a sua permissão, cookies de medição. Veja a <a href="#">Política de Privacidade</a>.</p>
    <div class="cookie__actions">
      <button class="btn btn--primary btn--sm" type="button">Aceitar</button>
      <button class="btn btn--secondary btn--sm" type="button">Recusar</button>
      <button class="cookie__prefs" type="button">Preferências</button>
    </div>
  </section>
</div>
</body>
</html>
