<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SectionHeader — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<style>
  .demo { padding: 32px 24px; }
  .demo .section-head { margin-bottom: 0; }
</style>
</head>
<body>
<div class="demo">
  <header class="section-head">
    <p class="eyebrow">Áreas de atuação</p>
    <h2 class="t-h2">Título da seção em serifa</h2>
    <p class="section-head__lead">Uma frase curta que apresenta o conteúdo da seção.</p>
  </header>
</div>
<div class="demo on-dark">
  <header class="section-head section-head--center">
    <p class="eyebrow">Fale com o escritório</p>
    <h2 class="t-h2">Título sobre o marinho</h2>
    <p class="section-head__lead">Lead em cinza-azulado claro, 7,1:1.</p>
  </header>
</div>
</body>
</html>
