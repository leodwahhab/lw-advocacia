<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>WhatsAppFab — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<style>
  .demo { padding: 32px 24px; display: flex; flex-wrap: wrap; gap: 40px; align-items: start; }
  .item { display: grid; gap: 12px; justify-items: center; }
  .item p { margin: 0; }
</style>
</head>
<body>
<div class="demo">
  <div class="item">
    <a class="fab fab--static" href="#" aria-label="Conversar no WhatsApp"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></a>
    <p class="t-caption t-muted">Default</p>
  </div>
  <div class="item">
    <a class="fab fab--static is-hover" href="#" aria-label="Conversar no WhatsApp"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></a>
    <p class="t-caption t-muted">Hover</p>
  </div>
  <div class="item">
    <a class="fab fab--static is-focus" href="#" aria-label="Conversar no WhatsApp"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></a>
    <p class="t-caption t-muted">Foco</p>
  </div>
  <div class="item">
    <a class="fab fab--static" id="pulse" href="#" aria-label="Conversar no WhatsApp"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></a>
    <button class="btn btn--secondary btn--sm" type="button" id="replay">Ver o pulso</button>
  </div>
</div>
<script>
  document.getElementById('replay').addEventListener('click', function () {
    var f = document.getElementById('pulse');
    f.classList.remove('is-pulsing'); void f.offsetWidth; f.classList.add('is-pulsing');
  });
</script>
</body>
</html>
