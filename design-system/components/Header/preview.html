<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Header — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<style>
  .demo { display: grid; gap: 24px; padding: 24px 0; }
  .demo .site-header { position: relative; top: auto; }
  .demo .site-nav { display: flex; gap: 32px; margin-left: auto; }
  .demo .logo { height: 48px; }
  .mobile { width: 390px; max-width: 100%; }
  .mobile .site-nav { display: none; }
  .mobile .logo { height: 40px; }
  .label { margin: 0 24px 8px; }
</style>
</head>
<body>
<div class="demo">
  <div>
    <p class="eyebrow label">Desktop, após rolar (.is-scrolled)</p>
    <header class="site-header on-dark is-scrolled">
      <div class="container site-header__inner">
        <a class="logo" href="#" aria-label="LW Advocacia, página inicial"><img src="/_blob/2351b9c533e2578ad75449c31dc6e5da" alt="" width="1376" height="768"></a>
        <nav class="site-nav" aria-label="Seções">
          <a href="#">Atuação</a><a class="is-hover" href="#">Sobre</a><a href="#">Como funciona</a><a href="#">Dúvidas</a>
        </nav>
        <a class="btn btn--inverse btn--sm" href="#">Fale conosco</a>
      </div>
    </header>
  </div>
  <div class="mobile">
    <p class="eyebrow label">Celular, 390px</p>
    <header class="site-header on-dark">
      <div class="container site-header__inner">
        <a class="logo" href="#" aria-label="LW Advocacia, página inicial"><img src="/_blob/2351b9c533e2578ad75449c31dc6e5da" alt="" width="1376" height="768"></a>
        <a class="btn btn--inverse btn--sm" href="#">Fale conosco</a>
      </div>
    </header>
  </div>
</div>
</body>
</html>
